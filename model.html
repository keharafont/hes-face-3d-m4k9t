<!doctype html>
<html lang="ja">
<head>

<title>3D モデル</title>
<style>
  :root{ --bg:#1c1f24; --fg:#e8eaed; --dim:#9aa3ad; --acc:#22d3ee }
  *{ box-sizing:border-box }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.45 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; overflow:hidden }
  #bar{ position:absolute; left:0; right:0; top:0; min-height:44px; display:flex; align-items:center; gap:10px; padding:4px 14px; flex-wrap:wrap; background:rgba(20,23,28,.85); border-bottom:1px solid #2b3037; z-index:5 }
  #bar b{ letter-spacing:.18em; font-size:13px } #bar a{ color:var(--dim); text-decoration:none; border:1px solid #3a4048; border-radius:4px; padding:3px 8px; font-size:12px }
  #bar select, #bar button{ font:12px -apple-system,sans-serif; color:var(--fg); background:#2a2f36; border:1px solid #3a4048; border-radius:4px; padding:5px 10px }
  #bar button.on{ border-color:var(--acc); color:var(--acc) }
  #bar .st{ color:var(--dim); font-size:11px; margin-left:auto; font-family:ui-monospace,Menlo,monospace; white-space:nowrap }
  #view{ position:absolute; inset:0 }
  #prog{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:360px; text-align:center; z-index:6; display:none }
  #prog .t{ font-size:12px; color:var(--dim); margin-bottom:8px; font-family:ui-monospace,Menlo,monospace }
  #prog .b{ height:8px; background:#0b0c0f; border:1px solid #3a4048; border-radius:4px; overflow:hidden } #prog .f{ height:100%; width:0; background:var(--acc) }
  #hint{ position:absolute; left:14px; bottom:12px; font-size:11px; color:var(--dim); z-index:5 }
  #viewBar{ position:absolute; left:14px; bottom:34px; display:flex; gap:4px; flex-wrap:wrap; justify-content:center; z-index:6; background:rgba(20,23,28,.85); border:1px solid #2b3037; border-radius:8px; padding:6px 8px }
  #viewBar button{ font:12px -apple-system,sans-serif; padding:5px 10px; border:1px solid #3a4048; border-radius:5px; background:#1c2027; color:#e8eaed; cursor:pointer } #viewBar button:hover{ background:#2a3038 }
  body.embed #viewBar{ display:none }
</style>
</head>
<body>
<div id="bar">
  <a href="/" title="トップページへ">⌂ HOME</a>
  <b>3D MODEL</b>
  <select id="sel"><option value="">モデルを選択…</option></select>
  <button id="rot" class="on">自動回転</button>
  <button id="wire">ワイヤー</button>
  <button id="env">明るさ</button>
  <button id="fit">全体表示</button>
  <button id="front">正面から</button>
  <button id="eyeZoom">目に寄る</button>
  <span style="width:1px;height:22px;background:#3a4048"></span>
  <button id="live" class="on">ライブ目玉</button>
  <button id="ee">4 表情</button>
  <button data-x="front">正面</button><button data-x="left">左向き</button><button data-x="right">右向き</button><button data-x="surprise">驚き</button>
  <span class="st" id="eeSt">EE —</span>
  <span class="st" id="st">—</span>
</div>
<div id="view"></div>
<div id="prog"><div class="t" id="progT">読み込み中…</div><div class="b"><div class="f" id="progF"></div></div></div>
<div id="hint">ドラッグで回転　ホイールで拡大　右ドラッグで移動</div>
<div id="viewBar"><button data-c="in">拡大 ＋</button><button data-c="out">縮小 −</button><button data-c="left">◀ 回す</button><button data-c="right">回す ▶</button><button data-c="up">▲ 上から</button><button data-c="down">▼ 下から</button><button data-c="front">正面</button><button data-c="eyes">目に寄る</button><button data-c="fit">全体</button><button data-c="rot">自動回転</button></div>
<div id="adj" style="position:absolute;right:14px;bottom:12px;z-index:5;background:rgba(20,23,28,.85);border:1px solid #2b3037;border-radius:6px;padding:8px 10px;font-size:11px;color:#9aa3ad;display:none">
  <div style="margin-bottom:4px;color:#e8eaed">目の貼り付け位置（レンズ上の UV）</div>
  <div>x <input type="range" id="ax" min="0" max="0.6" step="0.005" style="width:110px"> y <input type="range" id="ay" min="0" max="0.8" step="0.005" style="width:110px"></div>
  <div>幅 <input type="range" id="aw" min="0.2" max="1" step="0.005" style="width:110px"> 高 <input type="range" id="ah" min="0.1" max="0.8" step="0.005" style="width:110px"></div>
  <div>ウィンカー幅 <input type="range" id="alw" min="0.3" max="2.5" step="0.05" style="width:110px"> 目尻の張り出し <input type="range" id="alo" min="0" max="3" step="0.1" style="width:110px"></div>
  <div>外側＝右（右目） <input type="checkbox" id="aoutR" checked>　外側＝右（左目） <input type="checkbox" id="aoutL"></div>
  <div>左目 x 反転 <input type="checkbox" id="amir" checked>　<button id="areset" style="font:11px -apple-system,sans-serif;padding:2px 8px">初期値に戻す</button>　<span id="atxt"></span></div>
</div>
<iframe id="eyeR" src="eye-player.html?bare=1&view=driver&eye=right&nolamp=1" style="position:absolute;left:-2000px;top:0;width:640px;height:320px;border:0;background:#000"></iframe>
<iframe id="eyeL" src="eye-player.html?bare=1&view=driver&eye=left&nolamp=1" style="position:absolute;left:-2000px;top:340px;width:640px;height:320px;border:0;background:#000"></iframe>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);
const PREVIEW = /[?&]preview=1/.test(location.search), EMBED = /[?&]embed=1/.test(location.search);
if (PREVIEW){   // 表情エディタから使う: 目玉プレイヤーはプレビュー（親から届くフレームで描く）
  ['eyeR', 'eyeL'].forEach((id) => { const f = $(id); f.src = f.src.replace('bare=1', 'bare=1&preview=1'); });
  window.addEventListener('message', (ev) => { const d = ev.data || {}; if (d.type === 'frame'){ lastFrame = d.P; ['eyeR', 'eyeL'].forEach((id) => { try { $(id).contentWindow.postMessage(d, '*'); } catch(_){} }); } });
}
if (EMBED){ document.body.classList.add('embed'); $('bar').style.display = 'none'; $('hint').style.display = 'none'; document.body.style.background = '#000'; }
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(EMBED ? 1.25 : 2, devicePixelRatio));   // 埋め込み（共有版）は描画負荷を抑える
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1c1f24);
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 1000); camera.position.set(4, 2, 5);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.autoRotate = !EMBED; controls.autoRotateSpeed = 1.2;
const hemi = new THREE.HemisphereLight(0xffffff, 0x334455, 0.6); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(5, 8, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0xbfd4ff, 0.5); fill.position.set(-6, 3, -4); scene.add(fill);
const grid = new THREE.GridHelper(20, 40, 0x3a4048, 0x2b3037); grid.position.y = 0; scene.add(grid);
let model = null, wire = false, expo = 1.0;

// ---- 目（ヘッドライト）のテクスチャを EE で切り替える ----
// 右目／左目のメッシュに、tex の 4 表情（正面・右向き・左向き・驚き）を EE の視線と見開きで当てる
const EYE_TEX = {};   // { R: {front, right, left, surprise}, L: {...} }
const texLoader = new THREE.TextureLoader();
function loadEyeTex(){
  ['R', 'L'].forEach((side) => { EYE_TEX[side] = {}; ['front', 'right', 'left', 'surprise'].forEach((k) => {
    const t = texLoader.load('yaris_eye_' + side + '_' + k + '.jpg'); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; EYE_TEX[side][k] = t; }); });
}
loadEyeTex();
const eyeMesh = { R: null, L: null }, eyeState = { R: 'front', L: 'front' };
// レンズの実際の縁: メッシュの UV を 1024² に描いてマスクにし、列ごとの下端・上端を取る（ウィンカーはこの縁に沿わせる）
const lensEdge = { R: null, L: null };
function buildLensEdge(side){
  const m = eyeMesh[side]; if (!m) return;
  const g = m.geometry, uv = g.attributes.uv, idx = g.index; if (!uv) return;
  const cv = document.createElement('canvas'); cv.width = cv.height = 1024; const c = cv.getContext('2d'); c.fillStyle = '#fff';
  const tri = (a, b, d) => { c.beginPath(); c.moveTo(uv.getX(a) * 1024, uv.getY(a) * 1024); c.lineTo(uv.getX(b) * 1024, uv.getY(b) * 1024); c.lineTo(uv.getX(d) * 1024, uv.getY(d) * 1024); c.closePath(); c.fill(); };
  if (idx) for (let i = 0; i < idx.count; i += 3) tri(idx.getX(i), idx.getX(i + 1), idx.getX(i + 2)); else for (let i = 0; i < uv.count; i += 3) tri(i, i + 1, i + 2);
  const d = c.getImageData(0, 0, 1024, 1024).data, top = new Int16Array(1024).fill(-1), bot = new Int16Array(1024).fill(-1);
  for (let x = 0; x < 1024; x++){ for (let y = 0; y < 1024; y++){ if (d[(y * 1024 + x) * 4] > 128){ if (top[x] < 0) top[x] = y; bot[x] = y; } } }
  let x0 = -1, x1 = -1; for (let x = 0; x < 1024; x++) if (top[x] >= 0){ if (x0 < 0) x0 = x; x1 = x; }
  // 目尻＝細く尖った尾の側（マスクの高さが小さい端）。目頭はグリル側で背が高い（Yaris の実車形状）
  const span = x1 - x0, hgt = (a, b) => { let n = 0, t = 0; for (let x = a; x <= b; x++) if (top[x] >= 0){ t += bot[x] - top[x]; n++; } return n ? t / n : 0; };
  const hL = hgt(x0, x0 + Math.round(span * 0.12)), hR = hgt(x1 - Math.round(span * 0.12), x1);
  let hmax = 0; for (let x = x0; x <= x1; x++) if (top[x] >= 0) hmax = Math.max(hmax, bot[x] - top[x]);
  lensEdge[side] = { top, bot, x0, x1, mask: cv, outRightAuto: hR < hL, hmax };
  if (LIVE['out' + side] == null){ $('aout' + side).checked = hR >= hL; }
}
function findEyes(root){ eyeMesh.R = null; eyeMesh.L = null; root.traverse((o) => { if (o.isMesh){ if (o.name === '右目') eyeMesh.R = o; if (o.name === '左目') eyeMesh.L = o; } });
  buildLensEdge('R'); buildLensEdge('L');
  ['R', 'L'].forEach((side) => { const m = eyeMesh[side]; if (!m) return; m.material = m.material.clone(); m.material.emissive = new THREE.Color(0xffffff); m.material.emissiveIntensity = 0.55; setEye(side, 'front', true); });
  if (liveOn) liveApply(); }
function setEye(side, k, force){ const m = eyeMesh[side]; if (!m || !EYE_TEX[side] || !EYE_TEX[side][k]) return; if (!force && eyeState[side] === k) return; eyeState[side] = k; m.material.map = EYE_TEX[side][k]; m.material.emissiveMap = EYE_TEX[side][k]; m.material.needsUpdate = true; }
function setBoth(k){ setEye('R', k); setEye('L', k); }
// EE の出力 → 表情。視線 x にヒステリシス（0.3 で入り 0.18 で抜ける）、見開き／覚醒系の感情で「驚き」。最短保持 180ms
let eeOn = false, curX = 'front', lastSw = 0;
let lastFrame = null;
function applyEE(m, fromWs){
  if (fromWs && PREVIEW) return;   // プレビュー中（表情エディタ内）は親から届くフレームだけを使う。サーバのフレームと交互に混ざるとランプが震える
  if (m && m.gaze) lastFrame = m;
  if (!eeOn || !m.gaze) return;
  const now = performance.now(); if (now - lastSw < 180) return;
  const gx = m.gaze.x, open = m.lid && m.lid.upper ? m.lid.upper.open : 0.6, emo = m.emotion ? m.emotion.name : '';
  const widen = (m.events && m.events.widen) || open > 0.88 || emo === '覚醒' || emo === '気合い' || emo === 'しまった';
  let k;
  if (widen) k = 'surprise';
  else if (curX === 'right') k = gx > 0.18 ? 'right' : (gx < -0.3 ? 'left' : 'front');
  else if (curX === 'left') k = gx < -0.18 ? 'left' : (gx > 0.3 ? 'right' : 'front');
  else k = gx > 0.3 ? 'right' : (gx < -0.3 ? 'left' : 'front');
  if (k !== 'surprise') curX = k;
  if (k !== eyeState.R){ lastSw = now; setBoth(k); }
  $('eeSt').textContent = 'EE ' + emo + '  gaze ' + gx.toFixed(2) + '  → ' + k;
}
// ---- ② ライブ目玉: HES の目玉プレイヤー（2D 描画）をそのままレンズのテクスチャに焼き込む ----
// 目玉プレイヤーは自分でサーバに繋がり EE の出力で動くので、その canvas を毎フレーム写す
let liveOn = true;
const LIVE_DEF = { x: 0.03, y: 0.33, w: 0.92, h: 0.30, mirrorL: true, lw: 1.0, lo: 1.2, outR: null, outL: null };   // outR/outL null = 自動判定
const LIVE = Object.assign({}, LIVE_DEF);
try { Object.assign(LIVE, JSON.parse(localStorage.getItem('model-live') || '{}')); } catch(_){}
if (LIVE.v !== 2){ LIVE.outR = null; LIVE.outL = null; LIVE.v = 2; }   // 旧版の保存値: 目尻の向きは自動判定に戻す
const liveCv = { R: document.createElement('canvas'), L: document.createElement('canvas') }, liveTex = {};
const TEX = 768;   // 目玉キャンバスは 640px 幅なので 768 で情報は落ちない（1024 より転送・描画が軽い）。座標は 1024 系のまま transform で縮める
['R', 'L'].forEach((side) => { liveCv[side].width = TEX; liveCv[side].height = TEX; liveTex[side] = new THREE.CanvasTexture(liveCv[side]); liveTex[side].flipY = false; liveTex[side].colorSpace = THREE.SRGBColorSpace; });
function liveApply(){ ['R', 'L'].forEach((side) => { const m = eyeMesh[side]; if (!m) return; if (liveOn){ m.material.map = liveTex[side]; m.material.emissiveMap = liveTex[side]; m.material.emissiveIntensity = 0.8; } else { m.material.map = EYE_TEX[side][eyeState[side]]; m.material.emissiveMap = m.material.map; m.material.emissiveIntensity = 0.55; } m.material.needsUpdate = true; }); }
// 実際のレンズ外形（UV マスク）を目玉プレイヤーに渡す: 目玉プレイヤーはこの外形で灯体を描くので、
// 2D の灯体より高いところ（上まぶたが見えていた領域）もリフレクターと可動域になる
let lensSentAt = 0;
function sendLens(){
  ['R', 'L'].forEach((side) => {
    const e = lensEdge[side], fr = $('eye' + side); if (!e || e.x0 < 0 || !fr.contentWindow) return;
    const x = LIVE.x * 1024, y = LIVE.y * 1024, w = LIVE.w * 1024, h = LIVE.h * 1024, mir = side === 'L' && LIVE.mirrorL;
    const N = 48, top = [], bot = [];
    for (let i = 0; i <= N; i++){ const tx = Math.round(e.x0 + (e.x1 - e.x0) * i / N); if (e.top[tx] < 0) continue; const nx = mir ? (x + w - tx) / w : (tx - x) / w; top.push([nx, (e.top[tx] - y) / h]); bot.push([nx, (e.bot[tx] - y) / h]); }
    try { fr.contentWindow.postMessage({ type: 'lens', top, bot }, '*'); } catch(_){}
  });
}
const liveFrameNo = { R: -1, L: -1 }, baseCache = {};
let lastTickAt = 0;
function liveTick(){
  if (!liveOn) return;
  const now = performance.now();
  if (now - lastTickAt < 28) return;   // 焼き込みは 30fps 上限（目玉プレイヤー自体が 30fps）
  lastTickAt = now;
  if (now - lensSentAt > 1000){ lensSentAt = now; sendLens(); }
  ['R', 'L'].forEach((side) => {
    const fr = $('eye' + side); let src = null, fno = 0; try { src = fr.contentDocument && fr.contentDocument.getElementById('c'); fno = fr.contentWindow.__frameNo || 0; } catch(_){}
    if (!src || !src.width) return;
    if (fno && fno === liveFrameNo[side]) return;   // 目玉が描き直されていなければテクスチャも更新しない
    liveFrameNo[side] = fno;
    const g = liveCv[side].getContext('2d'); g.setTransform(TEX / 1024, 0, 0, TEX / 1024, 0, 0); g.fillStyle = '#000'; g.fillRect(0, 0, 1024, 1024);
    // レンズの地（静的）はキャッシュしておく
    const e = lensEdge[side];
    if (e && baseCache[side] !== e){ const bc = document.createElement('canvas'); bc.width = bc.height = 1024; drawLensBase(bc.getContext('2d'), side); baseCache[side] = e; baseCache[side + 'cv'] = bc; }
    if (baseCache[side + 'cv']) g.drawImage(baseCache[side + 'cv'], 0, 0);
    g.save();
    const x = LIVE.x * 1024, y = LIVE.y * 1024, w = LIVE.w * 1024, h = LIVE.h * 1024;
    if (side === 'L' && LIVE.mirrorL){ g.translate(x + w, y); g.scale(-1, 1); g.drawImage(src, 0, 0, w, h); } else g.drawImage(src, x, y, w, h);
    g.restore();
    drawLamp(g, side);
    liveTex[side].needsUpdate = true;
  });
}
// レンズ（UV マスク）の内側を、2D リフレクターの上縁と同系のグレーで塗る。2D 描画はこの上に透明背景で重なる
function drawLensBase(g, side){
  const e = lensEdge[side]; if (!e || e.x0 < 0) return;
  let yT = 1024, yB = 0; for (let x = e.x0; x <= e.x1; x++) if (e.top[x] >= 0){ yT = Math.min(yT, e.top[x]); yB = Math.max(yB, e.bot[x]); }
  g.beginPath(); let first = true;
  for (let x = e.x0; x <= e.x1; x++){ if (e.top[x] < 0) continue; first ? g.moveTo(x, e.top[x] - 1) : g.lineTo(x, e.top[x] - 1); first = false; }
  for (let x = e.x1; x >= e.x0; x--){ if (e.top[x] < 0) continue; g.lineTo(x, e.bot[x] + 1); }
  g.closePath();
  const gr = g.createLinearGradient(0, yT, 0, yB); gr.addColorStop(0, 'rgb(62,66,72)'); gr.addColorStop(0.35, 'rgb(96,100,106)'); gr.addColorStop(1, 'rgb(40,44,50)');
  g.fillStyle = gr; g.fill();
}
// ウィンカー／ポリスの帯を、レンズの実際の下縁（UV マスクから取った縁）に沿って描く。目尻側ほど太く、外縁で張り出す
function drawLamp(g, side){
  const e = lensEdge[side], P = lastFrame; if (!e || e.x0 < 0) return;
  const sg = P && P.signal, po = P && P.police, seqOn = !!(P && P.lampSeq), lw = ((P && P.lampWidth) || 1) * LIVE.lw;
  const outRight = LIVE['out' + side] == null ? e.outRightAuto : LIVE['out' + side];   // 未設定なら自動判定（縦の縁が立っている側が目尻）
  const sideKey = side === 'R' ? 'R' : 'L';
  const mine = sg && (sg.side === 'H' || sg.side === sideKey);
  let poLit = false, col = ['rgb(255,112,0)', 'rgba(255,90,0,.9)', ''];   // オレンジ（アンバー）
  if (po){ const pp = po.ph || 0, isL = side === 'L'; poLit = isL ? ((pp >= 0 && pp < 0.12) || (pp >= 0.2 && pp < 0.32)) : ((pp >= 0.5 && pp < 0.62) || (pp >= 0.7 && pp < 0.82)); col = isL ? ['rgb(255,16,16)', 'rgba(255,30,30,.95)', ''] : ['rgb(20,70,255)', 'rgba(40,90,255,.95)', '']; }
  const SEG = 12, LAMP_T0 = 0.12, span = e.x1 - e.x0, base = e.hmax * 0.075 * lw;   // 2D 目玉と同じ式（灯体の高さ × 0.075 × 幅）
  for (let k = 0; k < SEG; k++){
    // 目頭→目尻の順にセグメントを並べる（outRight なら x の小さい側が目頭）
    const t0 = LAMP_T0 + (1 - LAMP_T0) * k / SEG, t1 = LAMP_T0 + (1 - LAMP_T0) * (k + 1) / SEG;   // 目頭の先端には入れない
    const xa = outRight ? e.x0 + span * t0 : e.x1 - span * t0, xb = outRight ? e.x0 + span * t1 : e.x1 - span * t1;
    let lit = false; if (po) lit = poLit; else if (mine && sg.on) lit = seqOn ? ((sg.ph || 0) * 1.25 >= (k + 1) / SEG) : true;
    g.beginPath();
    const N = 8, pts = [];
    for (let i = 0; i <= N; i++){ const x = Math.round(xa + (xb - xa) * i / N), xc = Math.max(e.x0, Math.min(e.x1, x)); const tt = t0 + (t1 - t0) * i / N; const avail = Math.max(2, e.bot[xc] - e.top[xc]);
      let th = base * (0.45 + 1.15 * tt); if (tt > 0.72) th += (tt - 0.72) / 0.28 * avail * 0.55 * LIVE.lo; th = Math.min(th, avail * 0.92);   // 2D と同じテーパー
      pts.push([x, e.bot[xc] - 2, e.bot[xc] - 2 - th]); }
    pts.forEach((p, i) => { i ? g.lineTo(p[0], p[2]) : g.moveTo(p[0], p[2]); });
    for (let i = pts.length - 1; i >= 0; i--) g.lineTo(pts[i][0], pts[i][1]);
    g.closePath();
    if (lit){ g.save(); g.shadowColor = col[1]; g.shadowBlur = 14; g.fillStyle = col[0]; g.fill(); g.shadowBlur = 0; g.restore(); }
    // 消灯時は何も描かない（レンズのリフレクターがそのまま見える）
  }
}

// スライダのドラッグ対策（faces.html と同じ）: Chrome 標準の range ドラッグはポインタキャプチャに依存し、
// 環境によってはつまみの真上でしか値が変わらない。標準のドラッグは使わず、ページ側でポインタを追従させる
(function(){
  let drag = null;
  const decimals = (step) => { const t = String(step), i = t.indexOf('.'); return i < 0 ? 0 : t.length - i - 1; };
  function setFromX(r, x){
    const rc = r.getBoundingClientRect(), T = 16;
    const f = Math.max(0, Math.min(1, (x - rc.left - T / 2) / Math.max(1, rc.width - T)));
    const min = +r.min, max = +r.max, step = +r.step || 0.01;
    const v = Math.max(min, Math.min(max, min + Math.round(f * (max - min) / step) * step));
    const t = v.toFixed(decimals(step));
    if (r.value !== t){ r.value = t; r.dispatchEvent(new Event('input', { bubbles: true })); return true; }
    return false;
  }
  function finish(){ if (!drag) return; const d = drag; drag = null; if (d.changed) d.r.dispatchEvent(new Event('change', { bubbles: true })); }
  document.querySelectorAll('input[type=range]').forEach((r) => {
    r.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || e.pointerType === 'touch') return;
      e.preventDefault(); r.focus(); drag = { r, changed: setFromX(r, e.clientX) };
    });
  });
  document.addEventListener('pointermove', (e) => {
    if (!drag) return;
    if (!(e.buttons & 1)){ finish(); return; }
    if (setFromX(drag.r, e.clientX)) drag.changed = true;
  }, true);
  ['pointerup', 'pointercancel'].forEach((n) => document.addEventListener(n, finish, true));
  window.addEventListener('blur', finish);
})();

let lastRenderAt = 0, slowFrames = 0, prMin = 0.6, statN = 0, statSum = 0, statMax = 0, statAt = 0;
let viewHold = null, viewHoldUntil = 0, viewTween = null;   // 視点ボタン（loop より前に宣言）
(function loop(){ requestAnimationFrame(loop); const now = performance.now(); if (EMBED && now - lastRenderAt < 30) return;
  // 重い環境（GPU が弱い・高 DPI）では描画解像度を自動で落とす: 1 フレーム 60ms 超が 40 回続いたら 25% ずつ、下限 0.6
  if (EMBED && lastRenderAt && now - lastRenderAt > 60){ if (++slowFrames >= 40){ slowFrames = 0; const pr = renderer.getPixelRatio(); if (pr > prMin){ renderer.setPixelRatio(Math.max(prMin, pr * 0.75)); resize(); console.log('[3D] 描画解像度を下げました → pixelRatio', renderer.getPixelRatio().toFixed(2)); } } } else slowFrames = Math.max(0, slowFrames - 1);
  const dtv = Math.min(0.1, (now - (lastRenderAt || now)) / 1000); lastRenderAt = now; viewStep(dtv); viewTweenStep(); liveTick(); controls.update(); renderer.render(scene, camera);
  const took = performance.now() - now; statN++; statSum += took; statMax = Math.max(statMax, took);   // 重さの報告用（5 秒ごとにコンソールへ）
  if (now - statAt > 5000){ if (statAt) console.log('[3D] 1フレームの処理時間 平均 ' + (statSum / statN).toFixed(1) + 'ms 最大 ' + statMax.toFixed(1) + 'ms  pixelRatio ' + renderer.getPixelRatio().toFixed(2) + '  ' + renderer.domElement.width + 'x' + renderer.domElement.height); statAt = now; statN = 0; statSum = 0; statMax = 0; }
  })();   // 埋め込みは 30fps

function visibleBox(obj){ const box = new THREE.Box3(); obj.updateWorldMatrix(true, true); obj.traverse((o) => { if (o.isMesh && o.visible){ o.geometry.computeBoundingBox(); const b = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld); box.union(b); } }); return box; }
function fitTo(obj){
  const box = visibleBox(obj); const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z);
  obj.position.sub(center); obj.position.y += size.y / 2;   // 床に置く
  grid.position.y = 0;
  const dist = r / (2 * Math.tan(camera.fov * Math.PI / 360)) * 1.25;
  camera.near = r / 100; camera.far = r * 50; camera.updateProjectionMatrix();
  camera.position.set(dist * 0.9, dist * 0.45, dist * 0.9); controls.target.set(0, size.y / 2, 0); controls.update();
  return { size, r };
}
function stats(obj){ let m = 0, t = 0; obj.traverse((o) => { if (o.isMesh){ m++; const g = o.geometry; t += g.index ? g.index.count / 3 : (g.attributes.position ? g.attributes.position.count / 3 : 0); } }); return { m, t }; }

// 暗号化モデル（yaris.bin = salt16 + iv12 + AES-GCM）: 入口で入れたパスワード（sessionStorage）で復号してから読む
async function loadGltf(loader, name, ok, prog, err){
  if (!/\.bin$/.test(name)){ loader.load(name, ok, prog, err); return; }
  try {
    const pw = sessionStorage.getItem('hes-share-pw'); if (!pw) throw new Error('パスワードが必要です（入口のページから開いてください）');
    const res = await fetch(name); if (!res.ok) throw new Error('モデルを取得できません'); const total = +res.headers.get('content-length') || 0;
    const reader = res.body.getReader(); const chunks = []; let got = 0; while (true){ const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; if (prog) prog({ loaded: got, total }); }
    const buf = new Uint8Array(got); let o = 0; for (const c of chunks){ buf.set(c, o); o += c.length; }
    const salt = buf.slice(0, 16), iv = buf.slice(16, 28), ct = buf.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 300000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    loader.parse(pt, './', ok, err);
  } catch (e){ if (err) err(e); }
}
async function load(name){
  if (!name) return;
  if (model){ scene.remove(model); model = null; }
  $('prog').style.display = 'block'; $('progF').style.width = '0%'; $('progT').textContent = name + ' を読み込み中…';
  const loader = new GLTFLoader(); const dr = new DRACOLoader(); dr.setDecoderPath('./'); loader.setDRACOLoader(dr);
  loadGltf(loader, name, (gltf) => {
    model = gltf.scene; scene.add(model);
    model.traverse((o) => { if (o.isMesh){ o.castShadow = false; if (o.material){ o.material.wireframe = wire; } if (/^平面/.test(o.name) || (o.material && /Fabric/i.test(o.material.name || ''))) o.visible = false; } });   // スタジオの背景幕（布の平面）は隠す
    findEyes(model);
    const f = fitTo(model), s = stats(model);
    $('st').textContent = name + '  ' + s.m + ' meshes  ' + Math.round(s.t).toLocaleString() + ' tris  ' + f.size.x.toFixed(2) + ' × ' + f.size.y.toFixed(2) + ' × ' + f.size.z.toFixed(2) + ' m';
    $('prog').style.display = 'none';
    if (EMBED){ grid.visible = false; scene.background = new THREE.Color(0x000000); $('adj').style.display = 'none'; setTimeout(() => $('front').click(), 50); }
    try { localStorage.setItem('model-sel', name); } catch(_){}
  }, (ev) => { if (ev.total){ const p = ev.loaded / ev.total; $('progF').style.width = (p * 100).toFixed(0) + '%'; $('progT').textContent = name + '  ' + (ev.loaded / 1048576).toFixed(0) + ' / ' + (ev.total / 1048576).toFixed(0) + ' MB'; } else { $('progT').textContent = name + '  ' + (ev.loaded / 1048576).toFixed(0) + ' MB…'; } },
  (err) => { $('progT').textContent = '読み込みに失敗: ' + (err && err.message || err); });
}
$('sel').style.display = 'none'; load('yaris.bin');   // 共有版: 圧縮した 1 モデルだけ
$('sel').addEventListener('change', function(){ load(this.value); });
$('rot').addEventListener('click', function(){ controls.autoRotate = !controls.autoRotate; this.classList.toggle('on', controls.autoRotate); });

// 車の正面（+Z か -Z のどちらが前かは目のメッシュの位置で判定）
function meshCenter(m){ m.updateWorldMatrix(true, false); m.geometry.computeBoundingBox(); return m.geometry.boundingBox.clone().applyMatrix4(m.matrixWorld).getCenter(new THREE.Vector3()); }
function frontDir(){ if (!model) return new THREE.Vector3(0, 0, 1); const ps = ['R', 'L'].filter((k) => eyeMesh[k]).map((k) => meshCenter(eyeMesh[k])); if (!ps.length) return new THREE.Vector3(0, 0, 1); const mid = ps.reduce((a, b) => a.add(b), new THREE.Vector3()).multiplyScalar(1 / ps.length); const c = visibleBox(model).getCenter(new THREE.Vector3()); const d = mid.sub(c); d.y = 0; return d.normalize(); }   // 両目の中点 → 車の前方
$('front').addEventListener('click', function(){ if (!model) return; controls.autoRotate = false; $('rot').classList.remove('on'); const box = visibleBox(model), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3()); const d = frontDir(); const dist = Math.max(size.x, size.z) * (EMBED ? 0.95 : 1.6); const tgt = c.clone().add(d.clone().multiplyScalar(EMBED ? Math.max(size.x, size.z) * 0.3 : 0)).add(new THREE.Vector3(0, EMBED ? size.y * 0.1 : 0, 0)); camera.position.copy(tgt).add(d.multiplyScalar(dist)).add(new THREE.Vector3(0, size.y * 0.3, 0)); controls.target.copy(tgt); controls.update(); });
$('eyeZoom').addEventListener('click', function(){ const m = eyeMesh.R; if (!m) return; controls.autoRotate = false; $('rot').classList.remove('on'); const p = meshCenter(m); const d = frontDir(); camera.position.copy(p).add(d.multiplyScalar(0.9)).add(new THREE.Vector3(0, 0.12, 0)); controls.target.copy(p); controls.update(); });
// 視点操作ボタン（ページ内のバー、または親ページから {type:'view', cmd, hold}）
// 拡大／縮小／回す／上下は「押している間なめらかに動く」（毎フレーム少しずつ）。正面／目に寄る／全体はイージングで移動
const HOLD_CMDS = { in: 1, out: 1, left: 1, right: 1, up: 1, down: 1 };
function viewStep(dt){   // 押している間の連続移動
  if (!model || !viewHold) return;
  const t = controls.target, off = camera.position.clone().sub(t);
  const yaw = (deg) => off.applyAxisAngle(new THREE.Vector3(0, 1, 0), deg * Math.PI / 180);
  const pitch = (deg) => { const axis = new THREE.Vector3().crossVectors(off, new THREE.Vector3(0, 1, 0)).normalize(); off.applyAxisAngle(axis, -deg * Math.PI / 180); };
  if (viewHold === 'in') off.multiplyScalar(Math.exp(-1.1 * dt)); else if (viewHold === 'out') off.multiplyScalar(Math.exp(1.1 * dt));
  else if (viewHold === 'left') yaw(70 * dt); else if (viewHold === 'right') yaw(-70 * dt);
  else if (viewHold === 'up') pitch(45 * dt); else if (viewHold === 'down') pitch(-45 * dt);
  camera.position.copy(t).add(off); controls.update();
}
function animateTo(fn, dur){   // fn で決まる先の視点へイージングで寄せる
  const p0 = camera.position.clone(), t0 = controls.target.clone(); fn();
  const p1 = camera.position.clone(), t1 = controls.target.clone();
  camera.position.copy(p0); controls.target.copy(t0);
  viewTween = { p0, t0, p1, t1, start: performance.now(), dur: dur || 650 };
}
function viewTweenStep(){
  if (!viewTween) return; const k = Math.min(1, (performance.now() - viewTween.start) / viewTween.dur), e = 1 - Math.pow(1 - k, 3);
  camera.position.lerpVectors(viewTween.p0, viewTween.p1, e); controls.target.lerpVectors(viewTween.t0, viewTween.t1, e); controls.update();
  if (k >= 1) viewTween = null;
}
function viewCmd(cmd){
  if (!model) return;
  if (HOLD_CMDS[cmd]){ viewHold = cmd; viewHoldUntil = performance.now() + 160; return; }   // 単押しでも最低 160ms 分は動く
  if (cmd === 'stop'){ viewHold = null; return; }
  controls.autoRotate = false; $('rot').classList.remove('on');
  if (cmd === 'front') animateTo(() => $('front').click()); else if (cmd === 'eyes') animateTo(() => $('eyeZoom').click()); else if (cmd === 'fit') animateTo(() => fitTo(model));
  else if (cmd === 'rot'){ controls.autoRotate = !controls.autoRotate; $('rot').classList.toggle('on', controls.autoRotate); }
  else if (cmd === 'bright') $('env').click();
  controls.update();
}
window.addEventListener('message', (ev) => { const d = ev.data || {}; if (d.type !== 'view' || !d.cmd) return; if (d.cmd === 'stop'){ if (performance.now() >= viewHoldUntil) viewHold = null; else setTimeout(() => { viewHold = null; }, viewHoldUntil - performance.now()); } else viewCmd(d.cmd); });
document.querySelectorAll('#viewBar button').forEach((b) => {
  const c = b.dataset.c;
  if (HOLD_CMDS[c]){ const stop = () => { const wait = viewHoldUntil - performance.now(); if (wait > 0) setTimeout(() => { viewHold = null; }, wait); else viewHold = null; };
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); viewCmd(c); }); ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, stop)); }
  else b.addEventListener('click', () => viewCmd(c));
});
window.__v = { camera, controls, scene, viewCmd, step(dt){ viewStep(dt); viewTweenStep(); }, get model(){ return model; }, eyeMesh, render(){ liveTick(); controls.update(); renderer.render(scene, camera); } };
