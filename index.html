    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(IV) }, key, u8(CT));
    var html = new TextDecoder().decode(pt);
    try { sessionStorage.setItem('hes-share-pw', pw); } catch(_){}
    document.open(); document.write(html); document.close();
  }
  document.getElementById('g').addEventListener('submit', function(e){ e.preventDefault(); var m = document.getElementById('m'); m.textContent = '確認中…'; m.style.color = '#5a5a5a';
    open(document.getElementById('pw').value).catch(function(){ m.style.color = '#b5462a'; m.textContent = 'パスワードが違います'; }); });
  try { var saved = sessionStorage.getItem('hes-share-pw'); if (saved) open(saved).catch(function(){}); } catch(_){}
})();
